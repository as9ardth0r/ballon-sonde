[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hab-sim"
version = "0.1.0"
description = "Simulation de la charge utile ballon-sonde stratosphérique"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["sim"]

[tool.pytest.ini_options]
pythonpath = ["sim"]
testpaths = ["tests"]
